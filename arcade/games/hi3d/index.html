</style></head><body><header><b>故事造物社 <span style="font-size:12px;font-weight:400">v015 网页试玩</span></b><a href="https://github.com/Sirui0124/Hi3D-261108" target="_blank" rel="noopener">最新源码</a><a href="https://github.com/Sirui0124/Hi3D-261108/releases/latest" target="_blank" rel="noopener">Windows 下载</a><button id="fullscreen">全屏</button></header><canvas id="canvas" tabindex="0" aria-label="故事造物社游戏画面"></canvas><main id="welcome"><article><small>STORYMAKERS · WORKSHOP</small><h1>把故事，做成藏品。</h1><p>挑一张图纸，制作一件手办，经营你的故事小店。<br>两关 24 款作品，延续 Windows 最新版经营流程。</p><p id="tips">推荐使用电脑 Chrome 或 Edge。首次需下载约 330 MB 游戏素材。进度保存在当前浏览器；清理网站数据会删除存档。<br>AI 评估 Token 可在游戏设置中填写，内置作品无需 Token。</p><button id="start">开始试玩</button><progress id="progress" max="1" value="0"></progress><p id="status"></p><p id="error" role="alert"></p><pre id="details"></pre></article></main><pre id="qa-output"></pre><script src="index.js"></script><script>

const canvas=document.getElementById('canvas'),welcome=document.getElementById('welcome'),start=document.getElementById('start'),progress=document.getElementById('progress'),status=document.getElementById('status');
const nativeFetch=window.fetch.bind(window),logs=[];let bytesRead=0;const total=Object.values(payload).reduce((sum,x)=>sum+x.compressedBytes,0);
function recordError(...args){const line=args.join(' ');logs.push(line);document.getElementById('details').textContent=logs.slice(-12).join('\n');console.error(...args)}
async function loadPayload(name){const spec=payload[name],parts=new Array(spec.parts.length);let cursor=0;
 async function worker(){while(cursor<spec.parts.length){const i=cursor++;let response;for(let attempt=0;attempt<3;attempt++){try{response=await nativeFetch(spec.parts[i]);if(!response.ok)throw new Error('HTTP '+response.status);break}catch(err){if(attempt===2)throw err;await new Promise(r=>setTimeout(r,500*(attempt+1)))}}const reader=response.body.getReader(),blocks=[];for(;;){const {done,value}=await reader.read();if(done)break;blocks.push(value);bytesRead+=value.byteLength;progress.value=bytesRead/total;status.textContent=`正在下载素材 ${Math.min(100,Math.floor(bytesRead/total*100))}% · ${Math.round(bytesRead/1000000)} / ${Math.round(total/1000000)} MB`}parts[i]=new Blob(blocks)}}
 await Promise.all(Array.from({length:Math.min(3,spec.parts.length)},worker));status.textContent='正在展开素材并启动店铺…';const buffer=await new Response(new Blob(parts).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();if(buffer.byteLength!==spec.rawBytes)throw new Error('素材大小不符，请重新载入。');return buffer;
}
window.fetch=async function(input,options){const url=new URL(typeof input==='string'?input:input.url,location.href),name=url.pathname.split('/').pop();if(url.origin===location.origin && payload[name]){const buffer=await loadPayload(name);return new Response(buffer,{status:200,headers:{'Content-Type':name.endsWith('.wasm')?'application/wasm':'application/octet-stream','Content-Length':String(buffer.byteLength)}})}return nativeFetch(input,options)};
window.storyMakersPickGlb=function(callback){const input=document.createElement('input');input.type='file';input.accept='.glb';input.style.display='none';document.body.append(input);input.addEventListener('cancel',()=>{input.remove();callback('cancel','已取消选择')},{once:true});input.addEventListener('change',async()=>{const file=input.files[0];try{if(!file){callback('cancel','未选择文件');return}if(!file.name.toLowerCase().endsWith('.glb')||file.size>32*1024*1024){callback('error','请选择 32 MB 以内、含材质的 GLB 文件。');return}callback('ok',new Uint8Array(await file.arrayBuffer()))}catch(err){callback('error','读取文件失败，请重试。')}finally{input.remove()}},{once:true});input.click()};
