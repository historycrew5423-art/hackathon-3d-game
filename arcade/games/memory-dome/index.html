<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>公元 3026 · 出土文物馆</title>
    <script type="module" crossorigin src="./assets/index-Bc2kxzqh.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DMGMwjKT.css">
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="intro" id="intro"><p id="intro1"></p><p id="intro2"></p></div>

    <div class="scrim" id="scrim"></div>

    <aside class="placard" id="placard">
      <div class="no" id="pl-no"></div>
      <h2 class="name" id="pl-name"></h2>
      <div class="rule"></div>
      <p class="desc" id="pl-desc"></p>
      <div class="meta" id="pl-meta"></div>
    </aside>

    <figure class="polaroid" id="polaroid"><img id="pol-img" alt="" /><figcaption id="pol-cap"></figcaption></figure>

    <div class="upload" id="upload">
      <div class="up-card">
        <h3 id="up-title"></h3>
        <label class="up-drop" id="up-drop">
          <input type="file" id="up-file" accept="image/*" hidden />
          <img id="up-img" alt="" />
          <span id="up-hint"></span>
        </label>
        <div class="up-bar"><i id="up-fill"></i></div>
        <div class="up-step" id="up-step"></div>
      </div>
    </div>

    <h1 class="title" id="title"></h1>
    <p class="tagline" id="tagline"></p>

    <button class="lang" id="lang" aria-label="language">EN</button>
    <div class="prompt" id="prompt"></div>
    <div class="help" id="help"></div>
    <div class="enter" id="enter"></div>

  </body>
</html>
