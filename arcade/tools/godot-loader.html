<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ · 网页版</title>
<style>*{box-sizing:border-box}body{margin:0;background:#12131c;color:#eee8ef;font-family:system-ui,sans-serif}header{height:48px;display:flex;align-items:center;gap:24px;padding:0 20px;background:#1d1c29}header b{margin-right:auto}a{color:#d2bddc;text-decoration:none;font-size:13px}button{font:inherit;border:0;border-radius:7px;cursor:pointer;padding:12px 22px;background:#d6bfe7;color:#302435}header button{padding:6px 15px}#canvas{display:none;position:fixed;inset:48px 0 0;width:100%;height:calc(100% - 48px);outline:none}#welcome{position:fixed;inset:48px 0 0;display:grid;place-items:center;background:radial-gradient(ellipse at 80% 10%,#453851,transparent 70%),#171723}article{width:min(640px,90vw);padding:40px;border:1px solid #ffffff22;background:#22212de8;border-radius:18px}small{letter-spacing:3px;color:#b9a6c2}h1{font-size:38px;letter-spacing:-1px}p{color:#bdb2c5;line-height:1.9;font-size:14px}progress{width:100%;height:12px;accent-color:#d6bfe7;display:none;margin-top:22px}#error{color:#ffb6b6;white-space:pre-wrap}#status{font-size:13px}#start{font-weight:600;margin-top:10px}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:4px}</style>
<header><b>__TITLE__</b><a href="../../">返回大厅</a><button id="full">全屏</button></header><canvas id="canvas" tabindex="0" aria-label="__TITLE__游戏画面"></canvas><main id="welcome"><article><small>3D PLAYGROUND / WEBGL</small><h1>__TITLE__</h1><p>__DESCRIPTION__</p><p>推荐电脑 Chrome / Edge。首次下载约 __SIZE__ MB，加载完成后直接开始。</p><button id="start">开始体验 →</button><progress id="progress" max="1"></progress><p id="status" role="status"></p><p id="error" role="alert"></p></article></main>
<script src="index.js"></script><script>
const config=__CONFIG__,payload=__PAYLOAD__,nativeFetch=window.fetch.bind(window);
const canvas=document.querySelector('#canvas'),welcome=document.querySelector('#welcome'),button=document.querySelector('#start'),progress=document.querySelector('#progress'),status=document.querySelector('#status');
let bytesRead=0;const total=Object.values(payload).reduce((n,s)=>n+s.compressedBytes,0);
async function loadPayload(name){const spec=payload[name],parts=new Array(spec.parts.length);let cursor=0;
  async function worker(){while(cursor<spec.parts.length){const i=cursor++;let response;
    for(let attempt=0;attempt<3;attempt++){try{response=await nativeFetch(spec.parts[i]);if(!response.ok)throw Error('HTTP '+response.status);break}catch(error){if(attempt===2)throw error;}}
    const reader=response.body.getReader(),blocks=[];for(;;){const {done,value}=await reader.read();if(done)break;blocks.push(value);bytesRead+=value.byteLength;progress.value=bytesRead/total;status.textContent=`正在加载 ${Math.min(100,Math.floor(bytesRead/total*100))}% · ${Math.round(bytesRead/1000000)} / ${Math.round(total/1000000)} MB`;}
    parts[i]=new Blob(blocks);}}
  await Promise.all(Array.from({length:Math.min(3,spec.parts.length)},worker));status.textContent='正在展开素材并启动…';
  const buffer=await new Response(new Blob(parts).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();if(buffer.byteLength!==spec.rawBytes)throw Error('素材校验失败，请刷新重试');return buffer;
}
window.fetch=async(input,options)=>{const url=new URL(input instanceof Request?input.url:String(input),location.href),name=url.pathname.split('/').pop();if(url.origin===location.origin&&payload[name]){const buffer=await loadPayload(name);return new Response(buffer,{headers:{'Content-Type':name.endsWith('.wasm')?'application/wasm':'application/octet-stream','Content-Length':String(buffer.byteLength)}});}return nativeFetch(input,options);};
document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();};
button.onclick=async()=>{button.disabled=true;progress.style.display='block';try{if(!window.DecompressionStream)throw Error('请使用新版 Chrome 或 Edge');const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw Error('浏览器缺少 '+missing.join('、'));canvas.style.display='block';config.canvas=canvas;config.canvasResizePolicy=2;config.focusCanvas=false;const engine=new Engine(config);await engine.startGame();welcome.style.display='none';canvas.focus({preventScroll:true});}catch(error){document.querySelector('#error').textContent='启动失败：'+error.message;button.disabled=false;button.textContent='刷新后重试';button.onclick=()=>location.reload();}};
</script></html>
