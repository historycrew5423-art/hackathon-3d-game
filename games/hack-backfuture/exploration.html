<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光墙探索</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #061216; }
  canvas { display: block; width: 100%; height: 100%; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 47%, transparent 38%, #020a0ea8 100%); }
  #status { position: fixed; left: max(24px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); margin: 0; color: #aec4c9; font: 12px/1.6 system-ui, sans-serif; letter-spacing: .08em; }
  #objective { position: fixed; top: 24px; right: 24px; display: flex; align-items: center; gap: 9px; padding: 8px 11px; border: 1px solid #81968b55; border-radius: 8px; background: #071412df; color: #e5f0e7; font: 13px/1.5 system-ui, sans-serif; }
  #objective[hidden], #take-battery[hidden] { display: none; }
  #energy-slots { display: flex; gap: 4px; }
  #energy-slots i { width: 9px; height: 15px; border: 1px solid #96a99a; border-radius: 2px; }
  #energy-slots .filled { background: #ffd175; border-color: #ffda91; box-shadow: 0 0 8px #ffc76880; }
  #take-battery { position: fixed; transform: translate(-50%, -100%); z-index: 1; min-height: 44px; padding: 0 13px; border-radius: 8px; border: 1px solid #ffdb92; background: #18221d; color: #ffe7b8; font: 14px system-ui, sans-serif; cursor: pointer; touch-action: manipulation; }
  #take-battery:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  #preview-scenes { position: fixed; top: 24px; left: 24px; display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid #81968b80; border-radius: 8px; background: #071412df; font: 13px system-ui, sans-serif; }
  #preview-scenes a { display: grid; place-items: center; min-height: 36px; padding: 0 9px; border-radius: 5px; color: #e5f0e7; text-decoration: none; }
  #preview-scenes a:hover, #preview-scenes a[aria-current="page"] { background: #295249; color: #fff; }
  @media (max-width: 670px) { #preview-scenes { top: 70px; left: 12px; right: 12px; } }
  #ending-poster { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; overflow: hidden; color: #182638; background: #d6dce5 url('./cave-assets/ending-poster-silver.svg') center / cover no-repeat; font-family: system-ui, sans-serif; }
  #ending-poster header { position: absolute; top: clamp(24px, 6vh, 70px); left: 0; right: 0; text-align: center; pointer-events: none; }
  #ending-poster h1 { margin: .16em 0 0; font-size: clamp(38px, 7vw, 94px); letter-spacing: .16em; text-indent: .16em; text-shadow: 0 1px 0 #fff, 0 3px 8px #63758b3d; }
  .poster-kicker { color: #35495f; font: 700 11px ui-monospace, monospace; letter-spacing: .36em; }
  #ending-poster canvas { position: absolute; inset: 20% 0 10%; height: 70%; cursor: grab; touch-action: none; }
  #ending-poster canvas:active { cursor: grabbing; }
  #ending-poster canvas:focus-visible { outline: 2px solid #08777e; outline-offset: -4px; }
  .poster-close { position: absolute; top: 18px; right: 18px; }
  .poster-close button, .poster-feature summary { min-height: 44px; padding: 11px 15px; color: inherit; background: #eef2f7; border: 1px solid #7e8da0; border-radius: 7px; font: inherit; cursor: pointer; }
  .poster-feature { position: absolute; right: clamp(14px, 4vw, 56px); top: 43%; width: min(200px, 28vw); }
  .poster-feature p { background: #f2f5f8; border: 1px solid #8796a8; border-radius: 7px; padding: 12px; margin: 8px 0 0; font-size: 14px; }
  .poster-hint, #poster-model-status { position: absolute; inset: auto 0 5%; margin: 0; text-align: center; color: #35495f; font-size: 13px; pointer-events: none; }
  #poster-model-status { bottom: 43%; }
  @media (max-width: 620px) {
    #ending-poster canvas { inset: 19% 0 24%; height: 57%; }
    .poster-feature { top: auto; bottom: 9%; width: auto; max-width: min(230px, 65vw); }
    .poster-hint { bottom: 3%; }
  }
  #fade { position: fixed; inset: 0; background: #020609; opacity: 0; pointer-events: none; }
</style>
<script>
  if (location.protocol === 'file:') {
    location.replace('http://127.0.0.1:8765/exploration.html' + location.search + location.hash);
  }
</script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script defer src="./hi3d-background-music.js"></script>
</head>
<body>
<canvas id="scene" aria-label="光幕展厅与地下生态站"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div id="fade" aria-hidden="true"></div>
<p id="status" role="status">正在加载展厅…</p>
<div id="objective" role="status" hidden>
  <span>能量收集</span>
  <span id="energy-slots" aria-hidden="true"><i></i><i></i><i></i></span>
  <span id="energy-count">0/3</span>
  <span id="installed-count" hidden>已放入 0/3</span>
</div>
<button id="take-battery" type="button" hidden>取出电池</button>
<nav id="preview-scenes" aria-label="临时场景预览">
  <a href="?scene=hall">展厅</a>
  <a href="?scene=cave">洞穴</a>
  <a href="?scene=jellyfish">浮岛湖</a>
  <a href="?scene=observatory-room">实验室</a>
  <a href="?scene=finale">核心室</a>
</nav>
<dialog id="ending-poster" aria-labelledby="poster-title">
  <canvas tabindex="0" aria-label="主角 3D 模型，使用左右方向键旋转"></canvas>
  <header><span class="poster-kicker">HACK BACKFUTURE</span><h1 id="poster-title">回到未来</h1></header>
  <p id="poster-model-status" role="status">正在加载角色…</p>
  <p class="poster-hint">拖动或按 ← → 旋转角色</p>
  <details class="poster-feature"><summary>生成 3D 实物</summary><p>可将游戏角色制作成 3D 实物</p></details>
  <form class="poster-close" method="dialog"><button autofocus aria-label="关闭海报">关闭</button></form>
</dialog>
<script type="module">
const status = document.querySelector('#status');
const canvas = document.querySelector('#scene');
import { createParticleFigure, createFinale } from './finale-scene.js';
import { setupEndingPoster } from './ending-poster.js';

try {
  const [T, { GLTFLoader }, { Reflector }, { EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }, { createCave }, { createJellyfishLake }, { RoomEnvironment }] =
    await Promise.all([
      import('three'),
      import('three/addons/loaders/GLTFLoader.js'),
      import('three/addons/objects/Reflector.js'),
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/OutputPass.js'),
      import('./cave-scene.js'),
      import('./jellyfish-scene.js'),
      import('three/addons/environments/RoomEnvironment.js')
    ]);
  start(T, GLTFLoader, Reflector, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, createCave, createJellyfishLake, RoomEnvironment);
} catch (error) {
  status.textContent = '展厅加载失败，请检查网络连接和浏览器的 WebGL 支持。';
  console.error(error);
}

function start(T, GLTFLoader, Reflector, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, createCave, createJellyfishLake, RoomEnvironment) {
  const renderer = new T.WebGLRenderer({ canvas, antialias: true });
  const scene = new T.Scene();
  scene.background = new T.Color('#06161d');
  const camera = new T.PerspectiveCamera(34, 1, .1, 60);
  camera.position.set(0, 2.25, 17);
  camera.lookAt(0, 2.85, 0);

  const composer = new EffectComposer(renderer);
  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);
  const bloom = new UnrealBloomPass(new T.Vector2(1, 1), .42, .72, .76);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  const wall = new T.MeshStandardMaterial({ color: '#243b45', roughness: .93 });
  const trim = new T.MeshStandardMaterial({ color: '#0d2028', roughness: .9 });

  function box(material, width, height, depth, x, y, z) {
    const mesh = new T.Mesh(new T.BoxGeometry(width, height, depth), material);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    return mesh;
  }

  box(wall, 16, 9, .4, 0, 4.5, -.25);
  box(wall, .36, 9, 22, -8, 4.5, 10);
  box(wall, .36, 9, 22, 8, 4.5, 10);
  box(wall, 16, .35, 22, 0, 9, 10);
  for (const y of [.35, 1.6, 3.0, 4.4, 5.8, 7.2]) {
    box(trim, 15.7, .035, .035, 0, y, 0);
    for (const x of [-7.8, 7.8]) box(trim, .035, .045, 21, x, y, 10);
  }
  for (const x of [-7.0, -4.85, -2.78, 2.78, 4.85, 7.0]) {
    box(trim, .055, 9, .07, x, 4.5, .02);
  }
  const screenFrame = box(trim, 4.9, 4.9, .14, 0, 2.9, .09);

  scene.add(new T.HemisphereLight('#7ca9b7', '#182a35', .52));
  const spill = new T.PointLight('#abdff5', 48, 12, 2);
  spill.position.set(0, 2.8, 1.7);
  scene.add(spill);

  const time = { value: 0 };
  const lightWall = new T.Mesh(new T.PlaneGeometry(4.68, 4.68), new T.ShaderMaterial({
    uniforms: { uTime: time },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform float uTime;
      varying vec2 vUv;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
                   mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
      }
      float fbm(vec2 p) {
        float value = 0.0, weight = 0.5;
        for (int i = 0; i < 4; i++) {
          value += weight * noise(p);
          p = mat2(1.62, 1.24, -1.24, 1.62) * p + 2.3;
          weight *= 0.5;
        }
        return value;
      }
      float field(vec2 p, float t) {
        vec2 q = vec2(fbm(p + vec2(t, 0.0)), fbm(p + vec2(5.2, 1.3 - t)));
        vec2 r = vec2(fbm(p + q * 3.9 + vec2(1.7, 9.2 + t)),
                      fbm(p + q * 4.2 + vec2(8.3 - t, 2.8)));
        return fbm(p + 5.0 * r);
      }
      void main() {
        float t = uTime * 0.10;
        vec2 p = vUv * 3.9;
        float f = field(p, t);
        float ridge = 0.5 + 0.5 * sin(f * 30.0 + noise(p * 2.0) * 1.8);
        float relief = clamp((f - field(p + vec2(0.018, -0.014), t)) * 10.0, -0.24, 0.24);
        float silk = 0.50 + ridge * 0.35 + f * 0.27 + relief;
        vec2 edge = min(vUv, 1.0 - vUv);
        silk *= mix(0.84, 1.0, smoothstep(0.0, 0.035, min(edge.x, edge.y)));
        gl_FragColor = vec4(vec3(0.48, 0.73, 0.86) * silk + vec3(0.08, 0.12, 0.15), 1.0);
      }`
  }));
  lightWall.position.set(0, 2.9, .17);
  scene.add(lightWall);
  const endingScreen = new T.Mesh(
    new T.PlaneGeometry(4.68, 4.68),
    new T.MeshBasicMaterial({ color: '#10283b', toneMapped: false })
  );
  endingScreen.position.copy(lightWall.position);
  endingScreen.position.z += .005;
  endingScreen.visible = false;
  scene.add(endingScreen);
  const hallLighting = new T.Group();
  hallLighting.visible = false;
  const warmFill = new T.DirectionalLight('#ffe3bd', 1.8);
  warmFill.position.set(-3, 8, 8);
  hallLighting.add(warmFill, new T.HemisphereLight('#e2ecff', '#68584b', 1.6));
  const fixture = new T.MeshBasicMaterial({ color: '#ffebca' });
  for (const z of [3.8, 9.4]) {
    const panel = box(fixture, 8.4, .055, .16, 0, 8.78, z);
    hallLighting.add(panel);
    const lamp = new T.PointLight('#ffddb1', 105, 18, 2);
    lamp.position.set(0, 8.5, z);
    hallLighting.add(lamp);
  }
  scene.add(hallLighting);

  const baseMirror = Reflector.ReflectorShader;
  const floor = new Reflector(new T.PlaneGeometry(15.8, 22), {
    clipBias: .001,
    textureWidth: 640,
    textureHeight: 360,
    multisample: 0,
    shader: {
      uniforms: { ...baseMirror.uniforms, uTime: { value: 0 } },
      vertexShader: baseMirror.vertexShader.replace('varying vec4 vUv;', 'varying vec4 vUv; varying vec2 vFloor;')
        .replace('vUv =', 'vFloor = position.xy; vUv ='),
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        varying vec4 vUv;
        varying vec2 vFloor;
        void main() {
          vec2 uv = vUv.xy / vUv.w;
          float ripple = sin(vFloor.y * 29.0 + vFloor.x * 5.0 + uTime * 1.7)
                       + sin(vFloor.y * 57.0 - vFloor.x * 8.0 - uTime);
          uv += vec2(ripple * 0.0024, ripple * 0.0015);
          vec3 reflection = texture2D(tDiffuse, uv).rgb * 0.50
                          + texture2D(tDiffuse, uv + vec2(0.0028, 0.0015)).rgb * 0.25
                          + texture2D(tDiffuse, uv - vec2(0.0028, 0.0015)).rgb * 0.25;
          gl_FragColor = vec4(vec3(0.006, 0.016, 0.021) + reflection * vec3(0.29, 0.36, 0.40), 1.0);
        }`
    }
  });
  floor.rotation.x = -Math.PI / 2;
  floor.position.z = 10;
  floor.material.uniforms.uTime = time;
  scene.add(floor);

  const player = new T.Group();
  player.position.set(0, 0, 3.65);
  player.rotation.y = Math.PI;
  scene.add(player);

  const params = new URLSearchParams(location.search);
  const preview = params.get('scene');
  const lakePreview = preview === 'jellyfish';
  const observatoryPreview = preview === 'observatory';
  const roomPreview = preview === 'observatory-room';
  const finalePreview = preview === 'finale';
  const chargedPreview = finalePreview && params.get('preview') === 'charged';
  for (const link of document.querySelectorAll('#preview-scenes a')) {
    if (link.search === '?scene=' + (preview ?? 'hall')) link.setAttribute('aria-current', 'page');
  }
  const lakeOriginX = -.85, lakeOriginZ = -15;
  const cave = createCave(T, lakeOriginZ);
  import('three/addons/libs/meshopt_decoder.module.js').then(({ MeshoptDecoder }) =>
    new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('./hi3d-苔藓机器人_1.glb')
  ).then(({ scene: model }) => {
    cave.placeRobot(model, player);
  }).catch(error => {
    console.warn('苔藓机器人加载失败', error);
  });
  const fade = document.querySelector('#fade');
  const objective = document.querySelector('#objective');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const falling = new T.Scene();
  falling.background = new T.Color('#04111a');
  const streaks = new Float32Array(390 * 6);
  for (let i = 0; i < streaks.length; i += 6) {
    const angle = Math.random() * Math.PI * 2;
    const radius = .25 + Math.random() * 8;
    const y = Math.random() * 37 - 36;
    streaks.set([Math.cos(angle)*radius,y,Math.sin(angle)*radius,
      Math.cos(angle)*radius,y+.05+Math.random()*.34,Math.sin(angle)*radius],i);
  }
  const streakGeometry = new T.BufferGeometry().setAttribute('position',new T.BufferAttribute(streaks,3));
  const sparkleSizes = new Float32Array(streaks.length / 3);
  const sparklePhases = new Float32Array(streaks.length / 3);
  for (let i=0;i<sparkleSizes.length;i++) {
    sparkleSizes[i]=.065+Math.random()*.13;
    sparklePhases[i]=Math.random()*Math.PI*2;
  }
  streakGeometry.setAttribute('aSize',new T.BufferAttribute(sparkleSizes,1));
  streakGeometry.setAttribute('aPhase',new T.BufferAttribute(sparklePhases,1));
  const streakField = new T.LineSegments(streakGeometry,new T.LineBasicMaterial({
    color:'#9cecff',transparent:true,opacity:.14,blending:T.AdditiveBlending,depthWrite:false
  }));
  falling.add(streakField);
  const sparks = new T.Points(streakGeometry,cave.makeSparkleMaterial('#e7faff',.92));
  falling.add(sparks);
  let lake;
  let portalTransition;
  const lakeHint = '↑ ↓ ← →　沿圆盘走向对岸 · 按住 E 奔跑';
  let chapter = 'hall';
  let poster, departure, arrival;
  let arrivalElapsed = 0;
  let endingElapsed = 0, screenElapsed = 0;
  const posterPoint = { position: new T.Vector3(0, 1.23, .2) };
  function nearbyPoster() {
    return chapter === 'ending' && !arrival && !portalTransition && !poster.open &&
      Math.abs(player.position.x) <= 1.7 && player.position.z - posterPoint.position.z <= 2;
  }
  const roomIntroDuration = 2;
  let roomIntroRemaining = 0;
  let transitionTime = 0;
  const collectedBatteries = new Set();
  let finale;
  const installedCount = document.querySelector('#installed-count');
  const energySlots = [...document.querySelectorAll('#energy-slots i')];
  const energyCount = document.querySelector('#energy-count');
  const takeBattery = document.querySelector('#take-battery');
  const buttonPosition = new T.Vector3();
  const headTarget = new T.Vector3();
  const defaultBatteryDirection = new T.Vector3(0, 0, 1);
  const battery = new T.Group();
  const casing = new T.MeshStandardMaterial({
    color: '#49645c', emissive: '#29473a', emissiveIntensity: .85, metalness: .35, roughness: .38
  });
  const terminal = new T.MeshStandardMaterial({
    color: '#ffe3a3', emissive: '#ffab3f', emissiveIntensity: 2.4
  });
  battery.add(new T.Mesh(new T.BoxGeometry(.25, .37, .19), casing));
  const cap = new T.Mesh(new T.BoxGeometry(.12, .068, .13), terminal);
  cap.position.y = .215;
  battery.add(cap);
  const band = new T.Mesh(new T.BoxGeometry(.257, .10, .197), terminal);
  battery.add(band);
  battery.add(new T.PointLight('#ffbc59', 3.8, 2.2));
  let batteryFlight, batteryReady = false;

  new GLTFLoader().loadAsync('./hi3d-solar-lantern_2.glb').then(({ scene: model }) => {
    const bounds = new T.Box3().setFromObject(model);
    const size = bounds.getSize(new T.Vector3());
    const scale = .48 / Math.max(size.x, size.y, size.z);
    if (!Number.isFinite(scale) || scale <= 0) throw new Error('电池模型尺寸无效');
    model.scale.multiplyScalar(scale);
    model.position.addScaledVector(bounds.getCenter(new T.Vector3()), -scale);
    model.traverse(object => {
      if (!object.isPointLight) return;
      object.intensity = 1.8;
      object.distance = 2.2;
    });
    battery.clear();
    battery.add(model);
  }).catch(error => {
    console.warn('电池模型加载失败，使用备用外观', error);
  }).finally(() => {
    batteryReady = true;
  });

  const markerGeometry = new T.OctahedronGeometry(.23);
  const markerMaterial = new T.MeshStandardMaterial({
    color: '#ffe2a1', emissive: '#ff9e32', emissiveIntensity: 2.1, roughness: .28
  });

  function prepareBatteryPoints(area) {
    for (const point of area.batteryPoints ?? []) {
      if (!point.marker) {
        point.marker = new T.Mesh(markerGeometry, markerMaterial);
        point.marker.scale.set(.85, 1.45, .85);
        point.marker.position.copy(point.position);
        point.marker.add(new T.PointLight('#ffac52', 7.5, 3.2));
        area.scene.add(point.marker);
      }
      point.marker.visible = !collectedBatteries.has(point.id);
    }
  }

  function activeBatteryPoints() {
    if (portalTransition || roomIntroRemaining) return [];
    if (chapter === 'room') return lake.observatory.phase === 'ready' ? [lake.observatory.point] : [];
    return chapter === 'cave' ? [...cave.batteryPoints, ...(lake?.batteryPoints ?? [])] : [];
  }

  function nearbyBattery() {
    if (!batteryReady || batteryFlight || collectedBatteries.size >= energySlots.length) return;
    let nearest, distance = 1.25;
    for (const point of activeBatteryPoints()) {
      if (collectedBatteries.has(point.id) || Math.abs(point.position.y - player.position.y) > 3.6) continue;
      const candidate = Math.hypot(point.position.x - player.position.x, point.position.z - player.position.z);
      if (candidate < distance) {
        nearest = point;
        distance = candidate;
      }
    }
    return nearest;
  }

  function nearbyStart() {
    if (chapter !== 'room' || !batteryReady || portalTransition || roomIntroRemaining || batteryFlight) return;
    const { phase, button } = lake.observatory;
    if (phase === 'idle' &&
      Math.hypot(button.position.x - player.position.x, button.position.z - player.position.z) < 1.4) return button;
  }

  function startBattery() {
    if (roomIntroRemaining > 0 || poster?.open) return;
    if (nearbyPoster()) {
      clearInput();
      takeBattery.hidden = true;
      poster.show();
      return;
    }
    if (nearbyFinaleConsole()) {
      if (finale.insertAll(battery, collectedBatteries.size, reducedMotion)) {
        installedCount.textContent = '已放入 ' + finale.inserted + '/3';
        clearInput();
        takeBattery.hidden = true;
        chapter = 'departure';
        endingElapsed = 0;
        status.textContent = '观测站正在启动…';
      }
      return;
    }
    if (nearbyStart()) {
      lake.observatory.start(battery, reducedMotion);
      takeBattery.hidden = true;
      return;
    }
    const point = nearbyBattery();
    if (!point) return;
    const origin = (point.releasePosition ?? point.marker?.position ?? point.position).clone();
    if (point.marker) point.marker.visible = false;
    if (point === lake.observatory.point) lake.observatory.take();
    battery.position.copy(origin);
    battery.scale.setScalar(.06);
    battery.rotation.set(0, 0, 0);
    renderPass.scene.add(battery);
    batteryFlight = { id: point.id, origin, direction: point.releaseDirection ?? defaultBatteryDirection, elapsed: 0 };
    takeBattery.hidden = true;
  }

  function updateBattery(dt) {
    if (!batteryFlight) return;
    const flight = batteryFlight;
    flight.elapsed += dt;
    const duration = reducedMotion ? .8 : 1.8;
    const phase = Math.min(1, flight.elapsed / duration);
    const emerge = 1 - Math.pow(1 - Math.min(phase / .28, 1), 3);
    const receive = T.MathUtils.smootherstep(phase, .34, .84);
    const vanish = T.MathUtils.smoothstep(phase, .84, 1);
    battery.position.copy(flight.origin);
    battery.position.addScaledVector(flight.direction, .68 * emerge);
    battery.position.y += .16 * emerge;
    headTarget.copy(player.position);
    headTarget.y += 2.12 - .34 * vanish;
    headTarget.z += .23;
    battery.position.lerp(headTarget, receive);
    if (!reducedMotion) {
      battery.position.y += Math.sin(receive * Math.PI) * .28;
      battery.rotation.y = emerge * .7 + receive * 2.1;
    }
    battery.scale.setScalar(T.MathUtils.lerp(.06, 1.55, emerge) * (1 - vanish));
    if (phase < 1) return;
    battery.removeFromParent();
    batteryFlight = undefined;
    collectedBatteries.add(flight.id);
    const count = collectedBatteries.size;
    energyCount.textContent = count + '/' + energySlots.length;
    energySlots.forEach((slot, index) => slot.classList.toggle('filled', index < count));
  }

  function updateBatteryPrompt() {
    for (const { position, marker } of activeBatteryPoints()) {
      if (!marker?.visible) continue;
      marker.rotation.y = time.value * .83;
      marker.position.y = position.y + Math.sin(time.value * 2.2) * .09;
    }
    const start = nearbyStart();
    const insert = nearbyFinaleConsole();
    const showPoster = nearbyPoster();
    const point = showPoster ? posterPoint : insert ?? start ?? nearbyBattery();
    if (!point) {
      takeBattery.hidden = true;
      return;
    }
    takeBattery.textContent = showPoster ? '查看海报' : insert ? '装入全部电池' : start ? '启动仪器' : '取出电池';
    buttonPosition.copy(point.position);
    buttonPosition.y += .41;
    camera.updateMatrixWorld();
    buttonPosition.project(camera);
    const visible = Math.abs(buttonPosition.x) <= 1 && Math.abs(buttonPosition.y) <= 1
      && Math.abs(buttonPosition.z) <= 1;
    takeBattery.hidden = !visible;
    if (!visible) return;
    const x = (buttonPosition.x + 1) * innerWidth / 2;
    const y = (1 - buttonPosition.y) * innerHeight / 2;
    takeBattery.style.left = Math.round(T.MathUtils.clamp(x, 65, innerWidth - 65)) + 'px';
    takeBattery.style.top = Math.round(Math.max(48, y)) + 'px';
  }

  takeBattery.addEventListener('click', startBattery);
  document.querySelector('#ending-poster').addEventListener('close', () => {
    updateBatteryPrompt();
    if (!takeBattery.hidden) takeBattery.focus();
  });
  const cameraTarget = new T.Vector3();
  const cameraPosition = new T.Vector3();
  const originalMaterials = new Map();
  const movementHint = '↑ ↓ ← →　移动 · 按住 E 奔跑';
  let mixer, idle, walk, run;
  let headBone;
  let leftFootBone, rightFootBone;
  const hairSway = new T.Vector2();
  const hairSwayTarget = new T.Vector2();
  const characterFile = 'explorer-animated.glb';
  status.textContent = '正在加载人物…';
  new GLTFLoader().loadAsync('./' + characterFile).then(({ scene: model, animations }) => {
    const idleClip = T.AnimationClip.findByName(animations, 'Idle');
    const walkClip = T.AnimationClip.findByName(animations, 'Walk');
    if (!idleClip || !walkClip) throw new Error('人物模型缺少 Idle 或 Walk 动画');
    model.updateMatrixWorld(true);
    const bounds = new T.Box3();
    const meshBounds = new T.Box3();
    model.traverse(mesh => {
      if (!mesh.isMesh) return;
      mesh.geometry.computeBoundingBox();
      bounds.union(meshBounds.copy(mesh.geometry.boundingBox).applyMatrix4(mesh.matrixWorld));
    });
    const scale = 1.73 / (bounds.max.y - bounds.min.y);
    if (!Number.isFinite(scale) || scale <= 0) throw new Error('人物模型尺寸无效');

    const center = bounds.getCenter(new T.Vector3());
    model.scale.multiplyScalar(scale);
    model.position.addScaledVector(new T.Vector3(-center.x, -bounds.min.y, -center.z), scale);
    const silhouette = new T.MeshBasicMaterial({ color: '#020609' });
    model.traverse(mesh => {
      if (!mesh.isMesh) return;
      originalMaterials.set(mesh,mesh.material);
      mesh.material = silhouette;
      if (mesh.isSkinnedMesh) mesh.frustumCulled = false;
    });
    // This model has no dedicated hair bones. A tiny delayed head sway gives
    // its hair silhouette a soft follow-through without deforming the face.
    headBone = model.getObjectByName('Head');
    leftFootBone = model.getObjectByName('LeftFoot');
    rightFootBone = model.getObjectByName('RightFoot');
    mixer = new T.AnimationMixer(model);
    idle = mixer.clipAction(idleClip).play();
    walk = mixer.clipAction(walkClip).setEffectiveWeight(0);
    walk.enabled = false;
    mixer.update(0);
    player.add(model);
    poster = setupEndingPoster(T, GLTFLoader, characterFile, model, idleClip);
    new GLTFLoader().loadAsync('./explorer-run.glb').then(({ animations: runAnimations }) => {
      const runClip = T.AnimationClip.findByName(runAnimations, 'Run');
      if (!runClip) throw new Error('奔跑模型缺少 Run 动画');
      run = mixer.clipAction(runClip).setEffectiveWeight(0).play();
    }).catch(error => console.warn('奔跑动画加载失败', error));
    if (finalePreview || roomPreview || observatoryPreview || lakePreview || preview === 'battery' || preview === 'cave') enterCave(true);
    else if (preview === 'ending') setEndingLocation();
    else status.textContent = movementHint;
  }).catch(error => {
    status.textContent = '人物加载失败，请通过本地 HTTP 打开页面，并确认 ' + characterFile + ' 可访问。';
    console.error(error);
  });

  const arrows = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
  const pressed = new Set();
  window.addEventListener('keydown', event => {
    if (poster?.open) return;
    if (event.code === 'KeyQ' && !event.repeat) startBattery();
    if (event.code === 'KeyE' && (nearbyPoster() || nearbyFinaleConsole() || chapter === 'room' && (nearbyStart() || nearbyBattery()))) {
      event.preventDefault();
      if (!event.repeat) startBattery();
      return;
    }
    const key = event.code === 'KeyE' ? event.code : event.key;
    if (key !== 'KeyE' && !arrows.has(key)) return;
    event.preventDefault();
    if (!event.repeat && !portalTransition && !roomIntroRemaining && !arrival &&
      (chapter === 'hall' || chapter === 'cave' || chapter === 'room' || chapter === 'finale' || chapter === 'ending')) pressed.add(key);
  });
  window.addEventListener('keyup', event => pressed.delete(event.code === 'KeyE' ? event.code : event.key));
  function clearInput() {
    pressed.clear();
  }
  window.addEventListener('blur', clearInput);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearInput();
  });

  function resize() {
    const width = canvas.clientWidth, height = canvas.clientHeight;
    const ratio = Math.min(window.devicePixelRatio, 1.5);
    camera.aspect = width / height;
    const inCave = chapter === 'landing' || chapter === 'cave' || chapter === 'room';
    const viewWidth = chapter === 'room' ? .98 : chapter === 'finale' ? .62 : inCave ? .53 : .23;
    camera.fov = Math.max(inCave ? 46 : 34, T.MathUtils.radToDeg(2 * Math.atan(viewWidth / camera.aspect)));
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(ratio);
    renderer.setSize(width, height, false);
    if (!inCave || chapter === 'room') {
      composer.setPixelRatio(ratio);
      composer.setSize(width, height);
    }
    if (!inCave) {
      floor.getRenderTarget().setSize(640, Math.min(960, Math.round(640 / camera.aspect)));
    }
  }
  window.addEventListener('resize', resize);
  resize();

  const velocity = new T.Vector2();
  const direction = new T.Vector2();
  function readDirection(sprinting) {
    direction.set(Number(pressed.has('ArrowRight')) - Number(pressed.has('ArrowLeft')),
      Number(pressed.has('ArrowDown')) - Number(pressed.has('ArrowUp'))).normalize();
    if (sprinting && !direction.lengthSq()) {
      direction.set(Math.sin(player.rotation.y), Math.cos(player.rotation.y));
    }
  }
  const clock = new T.Clock();
  const walkingSpeed = 1.45;
  const runningSpeed = 3.1;
  // The reduced leg arc has a slightly shorter stride than the source clip.
  const walkClipSpeed = 1.54;
  const caveCameraRay = new T.Raycaster();
  const caveCameraAnchor = new T.Vector3();
  const caveCameraDirection = new T.Vector3();
  const caveCameraHits = [];

  function followUnderground(dt, landingHeight) {
    const { x, y, z } = player.position;
    const blend = T.MathUtils.smoothstep(z, lake.shoreZ + .5, lake.shoreZ + 4);
    cameraPosition.set(x * .85, landingHeight ?? T.MathUtils.lerp(3.05, y + 2.62, blend), z + 5.1);
    cameraTarget.set(x + blend * .3, T.MathUtils.lerp(.65, 1.52, blend), z - 4.6);
    if (z <= lake.farBankZ) {
      const view = lake.observatory.view(player.position);
      if (view.elevated) {
        cameraPosition.set(x, y + 2.4, z + 3.6);
        cameraTarget.set(x, y + 1.45, z - 3.1);
      } else {
        const depth = lake.shoreZ - z;
        const narrow = T.MathUtils.smoothstep(depth, 18.5, 22.5)
          * (1 - T.MathUtils.smoothstep(depth, 27.5, 32));
        cameraPosition.x = T.MathUtils.lerp(cameraPosition.x, lake.spawn.x + (x - lake.spawn.x) * .35, narrow);
        cameraPosition.y = T.MathUtils.lerp(cameraPosition.y, y + 1.9, narrow);
        cameraPosition.z = z + T.MathUtils.lerp(5.1, 2.1, narrow);
        cameraTarget.set(x - 1.6 * (1 - narrow), T.MathUtils.lerp(cameraTarget.y, y + 1.12, narrow),
          z - T.MathUtils.lerp(4.6, 3, narrow));
      }
    }
    camera.position.lerp(cameraPosition, dt === undefined ? 1 : 1 - Math.exp(-7 * dt));
    if (z <= lake.farBankZ) {
      caveCameraAnchor.set(x, y + 1.22, z);
      caveCameraDirection.subVectors(camera.position, caveCameraAnchor);
      const distance = caveCameraDirection.length();
      if (distance > .05) {
        caveCameraDirection.divideScalar(distance);
        caveCameraRay.set(caveCameraAnchor, caveCameraDirection);
        caveCameraRay.far = distance + .48;
        caveCameraHits.length = 0;
        caveCameraRay.intersectObjects(lake.cameraObstacles, false, caveCameraHits);
        if (caveCameraHits.length) {
          camera.position.copy(caveCameraAnchor).addScaledVector(caveCameraDirection,
            Math.min(distance, Math.max(.12, caveCameraHits[0].distance - .48)));
        }
      }
    }
    camera.lookAt(cameraTarget);
  }

  const roomIntroPosition = new T.Vector3();
  const roomIntroTarget = new T.Vector3();
  const indoorLook = new T.Vector3();

  function smoothIndoorCamera(dt) {
    const blend = dt === undefined ? 1 : 1 - Math.exp(-6 * dt);
    camera.position.lerp(cameraPosition, blend);
    indoorLook.lerp(cameraTarget, blend);
    camera.lookAt(indoorLook);
  }

  function followRoom(dt) {
    const room = lake.observatory;
    const { x, y, z } = player.position;
    const towardTree = T.MathUtils.smoothstep(x - room.roomSpawn.x, 2, 6);
    const nearBench = 1 - T.MathUtils.smoothstep(Math.abs(z - room.lookAtMachine.z), 1.2, 3.4);
    cameraPosition.set(T.MathUtils.lerp(x * .65 + room.roomSpawn.x * .35, x, towardTree)
      + nearBench * (1 - towardTree) * .55, y + 2.48 + nearBench * .34,
      Math.min(z + 3.65, room.doorwayZ + .78));
    cameraTarget.copy(room.lookAtMachine);
    cameraTarget.x += (x - room.roomSpawn.x) * .32;
    cameraTarget.lerp(room.portalPad, towardTree * .72);
    cameraTarget.y += towardTree * 1.05;
    if (roomIntroRemaining > 0) {
      roomIntroRemaining = Math.max(0, roomIntroRemaining - (dt ?? 0));
      const overview = T.MathUtils.smootherstep(roomIntroRemaining, 0, roomIntroDuration - .35);
      roomIntroPosition.set(room.roomSpawn.x - .9, room.roomSpawn.y + 4.25, room.doorwayZ + 3);
      roomIntroTarget.copy(room.lookAtMachine);
      roomIntroTarget.y -= .38;
      camera.position.copy(cameraPosition.lerp(roomIntroPosition, overview));
      cameraTarget.lerp(roomIntroTarget, overview);
      indoorLook.copy(cameraTarget);
      camera.lookAt(indoorLook);
      const overviewFov = Math.max(37, T.MathUtils.radToDeg(2 * Math.atan(.85 / camera.aspect)));
      const followFov = Math.max(46, T.MathUtils.radToDeg(2 * Math.atan(.98 / camera.aspect)));
      camera.fov = T.MathUtils.lerp(followFov, overviewFov, overview);
      camera.updateProjectionMatrix();
      if (!roomIntroRemaining) {
        player.visible = true;
        status.textContent = '靠近黄铜仪器的启动按钮';
      }
    } else {
      smoothIndoorCamera(dt);
    }
  }

  function nearbyFinaleConsole() {
    if (chapter !== 'finale' || portalTransition || !batteryReady ||
      finale.inserted || collectedBatteries.size < energySlots.length) return;
    const { position } = finale.consolePoint;
    if (Math.hypot(position.x - player.position.x, position.z - player.position.z) < 1.65) return finale.consolePoint;
  }

  function followFinale(dt) {
    const { x, z } = player.position;
    const approach = 1 - T.MathUtils.smoothstep(Math.hypot(x, z - .6), 1.35, 3.5);
    cameraPosition.set(x * .88 + .35 + 1.05 * approach, 3.15 + .45 * approach, Math.min(z + 3.9, 4.85));
    cameraTarget.set(x * .72, 1.65 - .21 * approach, Math.min(z - 2.8, -.9));
    smoothIndoorCamera(dt);
  }

  function setFinaleLocation() {
    finale ??= createFinale(T);
    chapter = 'finale';
    renderPass.scene = finale.scene;
    finale.scene.add(player);
    player.position.copy(finale.spawn);
    if (chargedPreview) player.position.z = 1.2;
    player.rotation.y = Math.PI;
    player.visible = true;
    installedCount.hidden = false;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = .86;
    renderer.shadowMap.enabled = false;
    bloom.threshold = 1.05;
    canvas.setAttribute('aria-label', '观测站核心室');
    resize();
    followFinale();
  }

  function setObservatoryLocation(indoors, returning = false) {
    const room = lake.observatory;
    chapter = indoors ? 'room' : 'cave';
    installedCount.hidden = true;
    renderer.toneMapping = indoors ? T.ACESFilmicToneMapping : T.NoToneMapping;
    renderer.toneMappingExposure = indoors ? .86 : 1;
    renderer.shadowMap.enabled = indoors;
    bloom.threshold = indoors ? 1.05 : .76;
    if (indoors && !room.room.environment) {
      const environment = new RoomEnvironment();
      const generator = new T.PMREMGenerator(renderer);
      room.room.environment = generator.fromScene(environment, .09).texture;
      room.room.environmentIntensity = .66;
      generator.dispose();
      environment.dispose();
    }
    renderPass.scene = indoors ? room.room : cave.scene;
    renderPass.scene.add(player);
    player.position.copy(returning ? room.portalReturn : indoors ? room.roomSpawn : room.outsideSpawn);
    player.rotation.y = indoors ? Math.PI : 0;
    canvas.setAttribute('aria-label', indoors ? '地下观测站实验室' : '地下观测站外部');
    resize();
    roomIntroRemaining = indoors && !returning && !reducedMotion ? roomIntroDuration : 0;
    player.visible = !roomIntroRemaining;
    if (roomIntroRemaining) status.textContent = '地下观测站';
    if (indoors) followRoom();
    else followUnderground();
  }

  function setEndingLocation() {
    chapter = 'ending';
    renderPass.scene = scene;
    scene.add(player);
    player.position.set(0, 0, 4.2);
    player.rotation.y = Math.PI;
    player.visible = true;
    for (const [mesh, material] of originalMaterials) mesh.material = material;
    if (!reducedMotion) {
      renderer.localClippingEnabled = true;
      arrivalElapsed = 0;
      arrival = createParticleFigure(T, scene, player, true);
      arrival.update(1);
    }
    objective.hidden = true;
    installedCount.hidden = true;
    hallLighting.visible = true;
    lightWall.visible = false;
    endingScreen.visible = true;
    screenElapsed = 0;
    const texture = new T.TextureLoader().load('./cave-assets/ending-screen-wardrobe.png');
    texture.colorSpace = T.SRGBColorSpace;
    endingScreen.material.map = texture;
    endingScreen.material.color.set('#ffffff');
    endingScreen.material.needsUpdate = true;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    bloom.threshold = 1.05;
    camera.position.set(0, 3.0, 12.4);
    camera.lookAt(0, 1.85, .2);
    canvas.setAttribute('aria-label', '亮灯的展厅与回到未来海报');
    resize();
  }

  function startPortal(destination) {
    portalTransition = { destination, elapsed: 0, switched: false };
    clearInput();
    takeBattery.hidden = true;
  }

  function enterCave(direct = false) {
    chapter = direct ? 'cave' : 'landing';
    transitionTime = 0;
    if (!lake) {
      const modelLoader = new GLTFLoader();
      lake = createJellyfishLake(T, modelLoader, cave, lakeOriginX, lakeOriginZ, Reflector);
      modelLoader.loadAsync('./cave-assets/models/observatory-house.glb')
        .then(({ scene: model }) => lake.observatory.placeHouse(model, lake.cameraObstacles))
        .catch(error => console.warn('观测站外观加载失败，保留原入口', error));
      modelLoader.loadAsync('./robot-house.glb')
        .then(({ scene: model }) => lake.observatory.placeRobot(model))
        .catch(error => console.warn('观测站机器人加载失败', error));
    }
    renderPass.scene = cave.scene;
    prepareBatteryPoints(cave);
    prepareBatteryPoints({ scene: cave.scene, batteryPoints: lake.batteryPoints });
    cave.scene.add(player);
    for (const [mesh, material] of originalMaterials) mesh.material = material;
    const point = cave.batteryPoints[0].position;
    const x = direct && lakePreview ? lake.spawn.x : direct && preview === 'battery' ? point.x - .25 : 0;
    const z = direct && lakePreview ? lake.spawn.z : direct && preview === 'battery' ? point.z + .9 : -1.3;
    player.position.set(x, cave.groundHeight(x, z), z);
    if (observatoryPreview) lake.enterFarBank(player);
    player.rotation.y = Math.PI;
    followUnderground(undefined, direct ? undefined : .93);
    resize();
    canvas.setAttribute('aria-label', '地下生态站的发光草地与园丁机器人');
    if (direct) {
      status.textContent = movementHint;
      objective.hidden = false;
      if (finalePreview) setFinaleLocation();
      else if (roomPreview) setObservatoryLocation(true);
    }
  }

  let movementWeight = 0, runBlend = 0;
  let wasMoving = false;
  const headOffset = new T.Quaternion();
  const headOffsetEuler = new T.Euler(0,0,0,'XYZ');
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), .05);
    time.value += dt;
    if (portalTransition) {
      const portal = portalTransition;
      const half = reducedMotion ? .09 : .21;
      portal.elapsed += dt;
      if (portal.elapsed >= half && !portal.switched) {
        if (portal.destination === 'finale') setFinaleLocation();
        else if (portal.destination === 'ending') setEndingLocation();
        else setObservatoryLocation(portal.destination !== 'cave', portal.destination === 'lab-return');
        portal.switched = true;
        portal.elapsed = half;
      }
      fade.style.opacity = T.MathUtils.clamp(1 - Math.abs(portal.elapsed / half - 1), 0, 1);
      if (portal.elapsed >= 2 * half) portalTransition = undefined;
    } else if (chapter === 'departure') {
      endingElapsed += dt;
      finale.update(dt, reducedMotion);
      walk.setEffectiveWeight(0);
      run?.setEffectiveWeight(0);
      idle.setEffectiveWeight(1);
      if (!departure) mixer.update(dt);
      if (!reducedMotion) {
        cameraPosition.set(1.65, 3.25, 5.25);
        cameraTarget.set(0, 1.82, -2.05);
        smoothIndoorCamera(dt);
        if (endingElapsed >= 1.9 && !departure) {
          renderer.localClippingEnabled = true;
          departure = createParticleFigure(T, finale.scene, player);
        }
        departure?.update(T.MathUtils.clamp(endingElapsed - 1.9, 0, 1));
      }
      if (finale.active && status.textContent !== '观测站已启动') status.textContent = '观测站已启动';
      if (endingElapsed >= (reducedMotion ? .45 : 2.9)) {
        player.visible = false;
        departure?.dispose();
        renderer.localClippingEnabled = false;
        startPortal('ending');
      }
    } else if (arrival) {
      arrivalElapsed += dt;
      const progress = T.MathUtils.smoothstep(arrivalElapsed, .32, 1.95);
      arrival.update(1 - progress);
      if (progress === 1) {
        arrival.dispose();
        arrival = undefined;
        renderer.localClippingEnabled = false;
      }
    } else if (chapter === 'fall') {
      transitionTime += dt;
      const duration = reducedMotion ? .55 : 1.92;
      const progress = Math.min(transitionTime/duration,1);
      if (!reducedMotion) {
        streakField.position.y = sparks.position.y = progress * 20;
        camera.rotation.z = progress * .13;
      }
      sparks.material.uniforms.uTime.value = time.value;
      fade.style.opacity = Math.max(1-progress*8,T.MathUtils.smoothstep(progress,.72,1));
      if (progress === 1) enterCave();
    } else if (chapter === 'landing') {
      transitionTime += dt;
      const progress = T.MathUtils.smoothstep(transitionTime,0,reducedMotion ? .28 : 1.05);
      fade.style.opacity = Math.max(0,1-progress*3);
      followUnderground(undefined, .93 + 1.69 * progress);
      if (progress === 1) {
        chapter = 'cave';
        status.textContent = movementHint;
        objective.hidden = false;
      }
    } else if (roomIntroRemaining > 0) {
      lake.observatory.update(dt);
      followRoom(dt);
    } else if (mixer && !poster?.open) {
      const sprinting = Boolean(run && pressed.has('KeyE'));
      const moveSpeed = sprinting ? runningSpeed : walkingSpeed;
      readDirection(sprinting);
      let speed;
      if (chapter === 'room') {
        const room = lake.observatory;
        room.update(dt);
        if (direction.lengthSq()) player.rotation.y = Math.atan2(direction.x, direction.y);
        const { x, z } = player.position;
        let nextX = x + direction.x * moveSpeed * dt;
        let nextZ = z + direction.y * moveSpeed * dt;
        if (room.roomGround(nextX, z) === undefined) nextX = x;
        if (nextZ >= room.doorwayZ - .15 && Math.abs(nextX - room.roomSpawn.x) <= .98 && !batteryFlight) {
          startPortal('cave');
        }
        if (room.roomGround(nextX, nextZ) === undefined) nextZ = z;
        player.position.set(nextX, room.roomGround(nextX, nextZ) ?? player.position.y, nextZ);
        const padDistance = Math.hypot(nextX - room.portalPad.x, nextZ - room.portalPad.z);
        if (!batteryFlight && padDistance < .72) startPortal('finale');
        speed = Math.hypot(nextX - x, nextZ - z) / Math.max(dt, .001);
        followRoom(dt);
        const hint = batteryFlight ? '正在收取电池…' : nearbyStart() ? '点击「启动仪器」或按 E'
          : nearbyBattery() ? '点击「取出电池」或按 E'
          : room.phase === 'running' ? '仪器正在运行…'
          : room.phase === 'ready' ? '电池已送出 · 靠近取料托盘'
          : padDistance < 3 || room.phase === 'collected' ? '踏上右侧机械树旁的蓝色地台'
          : '靠近黄铜仪器的启动按钮';
        if (status.textContent !== hint) status.textContent = hint;
      } else if (chapter === 'finale') {
        if (chargedPreview && batteryReady && finale.insertAll(battery, energySlots.length, reducedMotion)) {
          for (const slot of energySlots) slot.classList.add('filled');
          energyCount.textContent = '3/3';
          installedCount.textContent = '已放入 3/3';
        }
        if (direction.lengthSq()) player.rotation.y = Math.atan2(direction.x, direction.y);
        const { x, z } = player.position;
        let nextX = x + direction.x * moveSpeed * dt;
        let nextZ = z + direction.y * moveSpeed * dt;
        if (finale.ground(nextX, z) === undefined) nextX = x;
        if (finale.ground(nextX, nextZ) === undefined) nextZ = z;
        player.position.set(nextX, 0, nextZ);
        if (!chargedPreview && nextZ > 4.85 && Math.abs(nextX) < 1) startPortal('lab-return');
        speed = Math.hypot(nextX - x, nextZ - z) / Math.max(dt, .001);
        finale.update(dt, reducedMotion);
        followFinale(dt);
        const hint = finale.active ? (chargedPreview ? '观测站已启动 · 刷新可重播' : '观测站已启动 · 后方可返回实验室')
          : finale.inserted === 3 ? '核心正在启动…'
          : nearbyFinaleConsole() ? '点击「装入全部电池」或按 E'
          : collectedBatteries.size === energySlots.length ? '靠近核心控制台装入全部电池'
          : '集齐三块电池后一次装入 · 从后方返回实验室';
        if (status.textContent !== hint) status.textContent = hint;
      } else if (chapter === 'cave') {
        const state = lake.update(player, direction, dt, time.value, moveSpeed);
        const view = state.arrived && lake.observatory.view(player.position);
        if (view?.entered && !batteryFlight) startPortal('room');
        speed = state.speed;
        if (state.onNearBank && speed > .05 && player.position.z > lake.shoreZ + .85) cave.leaveTrail(player);
        followUnderground(dt);
        const hint = batteryFlight ? '正在收取电池…' : nearbyBattery() ? '点击「取出电池」或按 Q'
          : state.arrived ? view.elevated ? '沿台阶进入观测站' : '沿着灯光前往观测站'
          : player.position.z < lake.shoreZ + 2.5 ? lakeHint : movementHint;
        if (status.textContent !== hint) status.textContent = hint;
      } else {
        if (direction.lengthSq()) player.rotation.y = Math.atan2(direction.x, direction.y);
        const x = T.MathUtils.clamp(player.position.x + direction.x * moveSpeed * dt, -4.4, 4.4);
        const z = T.MathUtils.clamp(player.position.z + direction.y * moveSpeed * dt, .88, 8.0);
        speed = Math.hypot(x - player.position.x, z - player.position.z) / Math.max(dt, .001);
        player.position.set(x, 0, z);
      }
      velocity.copy(direction).multiplyScalar(speed);
      movementWeight = T.MathUtils.damp(movementWeight, T.MathUtils.smoothstep(speed, .04, .65), 8, dt);
      runBlend = T.MathUtils.damp(runBlend, sprinting ? 1 : 0, 15, dt);
      const walkWeight = movementWeight * (1 - runBlend);
      const moving = speed > .06;
      if (moving && !wasMoving) {
        // Start on the contact pose so the first visible step lands heel first.
        walk.reset();
        walk.enabled = true;
        walk.play();
      }
      walk.setEffectiveWeight(walkWeight).setEffectiveTimeScale(speed / walkClipSpeed);
      run?.setEffectiveWeight(movementWeight * runBlend).setEffectiveTimeScale(speed / runningSpeed * .8);
      idle.setEffectiveWeight(1 - movementWeight);
      mixer.update(dt);
      if (!moving && movementWeight < .015) walk.enabled = false;
      wasMoving = moving;

      if (moving && !sprinting && walkWeight > .04 && walk.getClip().duration > 0) {
        const cycle = ((walk.time / walk.getClip().duration) % 1 + 1) % 1;
        const heelFirstLift = phase => .105 * Math.max(
          1 - T.MathUtils.smoothstep(phase, 0, .12),
          T.MathUtils.smoothstep(phase, .77, .98)
        ) * walkWeight;
        // The clip begins on left-foot contact; the opposite foot lands half a cycle later.
        // With +Z as the model's forward axis, a slight negative local X pitch
        // lifts the toes so the heel reaches the ground first.
        leftFootBone?.rotateX(-heelFirstLift(cycle));
        rightFootBone?.rotateX(-heelFirstLift((cycle + .5) % 1));
      }

      if (headBone) {
        // Let the head (and attached hair mesh) lag a fraction behind travel.
        hairSwayTarget.set(-velocity.y * .004, velocity.x * .007);
        hairSway.x = T.MathUtils.damp(hairSway.x, hairSwayTarget.x, 4, dt);
        hairSway.y = T.MathUtils.damp(hairSway.y, hairSwayTarget.y, 4, dt);
        const stepFlutter = moving && !sprinting ? Math.sin(walk.time * Math.PI * 4) * .002 : 0;
        headOffsetEuler.set(hairSway.x + stepFlutter, 0, hairSway.y, 'XYZ');
        headOffset.setFromEuler(headOffsetEuler);
        headBone.quaternion.multiply(headOffset);
      }
      if (chapter === 'hall' && player.position.z <= 1.06 && Math.abs(player.position.x) < 1.85 && velocity.y < -.15) {
        chapter = 'fall';
        transitionTime = 0;
        clearInput();
        velocity.set(0,0);
        movementWeight = runBlend = 0;
        walk.setEffectiveWeight(0);
        run?.setEffectiveWeight(0);
        idle.setEffectiveWeight(1);
        mixer.update(0);
        renderPass.scene = falling;
        camera.position.set(0,0,2.1);
        camera.lookAt(0,-9,0);
        status.textContent = '';
        fade.style.opacity = 1;
      }
    }
    if (poster?.open) return;
    if (chapter === 'ending') {
      if (!portalTransition) screenElapsed = reducedMotion ? .7 : Math.min(.7, screenElapsed + dt);
      const shrink = T.MathUtils.smoothstep(screenElapsed, 0, .7);
      const scaleX = T.MathUtils.lerp(1, 3.4 / 4.68, shrink);
      const scaleY = T.MathUtils.lerp(1, 1.9 / 4.68, shrink);
      endingScreen.scale.set(scaleX, scaleY, 1);
      screenFrame.scale.set(scaleX, scaleY, 1);
      const hint = arrival ? '正在返回展厅…' : '';
      if (status.textContent !== hint) status.textContent = hint;
    }
    if (chapter === 'landing') lake.update(player, direction, 0, time.value, 0);
    if (chapter === 'landing' || chapter === 'cave') cave.update(time.value,dt,player);
    updateBattery(dt);
    updateBatteryPrompt();
    if (chapter === 'landing' || chapter === 'cave') {
      renderer.render(renderPass.scene, camera);
    } else {
      composer.render();
    }
  });
}
</script>
