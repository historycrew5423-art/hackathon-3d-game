<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>三打白骨精 · 白虎岭</title>
<style>
	html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #f2ede2; }
	#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
	#c:active { cursor: grabbing; }
	#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient( ellipse at 50% 40%, #1d2128, #07080a ); transition: opacity 0.8s; z-index: 10; }
	#loading.hidden { opacity: 0; pointer-events: none; }
	#loading h1 { margin: 0; font-weight: 600; letter-spacing: 0.4em; font-size: 34px; }
	#loading h1 small { display: block; text-align: center; letter-spacing: 0.3em; font-size: 15px; font-weight: 400; opacity: 0.6; margin-top: 10px; }
	#bar { width: 280px; height: 3px; background: rgba( 255, 255, 255, 0.12 ); border-radius: 2px; overflow: hidden; }
	#bar i { display: block; height: 100%; width: 0; background: linear-gradient( 90deg, #c9a45c, #f3e2b0 ); transition: width 0.3s; }
	#loadText { font-size: 13px; opacity: 0.6; }
	#hud { position: fixed; left: 18px; bottom: 16px; font-size: 12.5px; line-height: 1.7; text-shadow: 0 1px 3px rgba( 0, 0, 0, 0.7 ); opacity: 0.85; pointer-events: none; z-index: 5; }
	#views { position: fixed; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
	#views button { background: rgba( 15, 17, 20, 0.45 ); color: #f2ede2; border: 1px solid rgba( 255, 255, 255, 0.18 ); border-radius: 4px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; backdrop-filter: blur( 4px ); text-align: left; }
	#views button:hover { background: rgba( 60, 50, 30, 0.6 ); }
	#debug { position: fixed; left: 10px; top: 10px; font: 12px monospace; background: rgba( 0, 0, 0, 0.5 ); padding: 4px 8px; z-index: 6; }
	.hidden { display: none; }
	body.shot #hud, body.shot #views { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">
	<h1>白虎岭<small>三打白骨精</small></h1>
	<div id="bar"><i></i></div>
	<div id="loadText">正在准备……</div>
</div>
<div id="views">
	<button data-view="ref">1 远眺白虎岭</button>
	<button data-view="skull">2 白骨岭</button>
	<button data-view="mouth">3 骷髅洞口</button>
	<button data-view="left">4 崖上楼阁</button>
	<button data-view="terrace">5 梯田</button>
	<button data-view="gate">6 城门楼</button>
	<button data-view="village">7 山村</button>
	<button data-view="bridge">8 石拱桥</button>
	<button data-view="aerial">9 鸟瞰</button>
</div>
<div id="hud">拖动鼠标：转视角　WASD：移动　Q / E：下降 / 上升　Shift：加速　滚轮：前后推　数字键：切换视角</div>
<div id="debug" class="hidden"></div>
<script>if ( location.search.indexOf( 'shot' ) >= 0 ) document.body.classList.add( 'shot' );</script>
<script src="./app.js"></script>
</body>
</html>
